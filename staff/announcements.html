<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Announcements | Kenbridge Staff Portal</title>

    <meta
        name="description"
        content="Manage school announcements through the Kenbridge Christian School staff portal."
    >

    <meta
        name="theme-color"
        content="#08783f"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =====================================================
           STAFF ANNOUNCEMENTS PAGE
        ===================================================== */

        .staff-page {
            min-height: 100vh;
            background: #f5f7f6;
        }


        /* =====================================================
           STAFF HEADER
        ===================================================== */

        .staff-header {
            background: #08783f;
            color: #ffffff;
            padding: 18px 0;
        }


        .staff-header-inner {
            width: min(1200px, 92%);
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .staff-brand {
            display: flex;
            align-items: center;
            gap: 12px;

            color: #ffffff;
            text-decoration: none;
        }


        .staff-brand img {
            width: 52px;
            height: 52px;

            object-fit: contain;

            background: #ffffff;
            border-radius: 50%;
            padding: 5px;
        }


        .staff-brand-text strong {
            display: block;
            font-size: 18px;
        }


        .staff-brand-text span {
            display: block;

            font-size: 12px;

            opacity: .85;

            margin-top: 3px;
        }


        .staff-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            border: 1px solid rgba(255,255,255,.5);
            border-radius: 8px;

            color: #ffffff;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }


        .staff-logout:hover {
            background: rgba(255,255,255,.12);
        }


        /* =====================================================
           PAGE CONTAINER
        ===================================================== */

        .staff-container {
            width: min(1200px, 92%);
            margin: 0 auto;

            padding: 40px 0 60px;
        }


        .staff-page-heading {
            margin-bottom: 28px;
        }


        .staff-page-heading small {
            display: block;

            color: #08783f;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.5px;

            margin-bottom: 8px;
        }


        .staff-page-heading h1 {
            margin: 0 0 8px;

            color: #16352a;

            font-size: clamp(28px, 4vw, 40px);
        }


        .staff-page-heading p {
            margin: 0;

            color: #64736c;

            line-height: 1.7;
        }


        /* =====================================================
           ACTION BAR
        ===================================================== */

        .announcement-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }


        .announcement-search {
            flex: 1;

            min-width: 240px;

            padding: 13px 15px;

            border: 1px solid #d8e0dc;
            border-radius: 8px;

            background: #ffffff;

            font-size: 14px;
        }


        .announcement-search:focus {
            outline: none;

            border-color: #08783f;

            box-shadow:
                0 0 0 3px rgba(8,120,63,.10);
        }


        .add-announcement-button {
            border: none;

            background: #08783f;
            color: #ffffff;

            padding: 13px 18px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }


        .add-announcement-button:hover {
            opacity: .9;
        }


        /* =====================================================
           ANNOUNCEMENT CARDS
        ===================================================== */

        .announcements-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        .announcement-card {
            background: #ffffff;

            border: 1px solid #e1e8e4;

            border-radius: 12px;

            padding: 24px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.05);
        }


        .announcement-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(0,0,0,.07);
        }


        .announcement-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 14px;
        }


        .
