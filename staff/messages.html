<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages | Kenbridge Staff</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#1f2937}
header{background:#0b5d3b;color:#fff;padding:18px 22px}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px;opacity:.85}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h2{margin:0 0 15px;color:#0b5d3b;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:7px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:bold}
.primary{background:#0b5d3b;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#dc2626;color:#fff}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.notice{display:none;padding:11px;border-radius:7px;margin-bottom:15px}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#f0fdf4;color:#0b5d3b}
.unread{font-weight:bold;background:#fffbeb}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.read{background:#dcfce7;color:#166534}
.unread-badge{background:#fef3c7;color:#92400e}
.muted{color:#6b7280;font-size:13px}
#viewBox{display:none}
.message-body{white-space:pre-wrap;line-height:1.6;background:#f9fafb;padding:15px;border-radius:8px}
.meta{font-size:13px;color:#6b7280;line-height:1.8;margin-bottom:12px}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
main{margin:15px auto;padding:10px}
}
</style>
</head>

<body>

<header>
<h1>Messages</h1>
<p>Send and manage messages with staff members.</p>
</header>

<main>

<div id="message" class="notice"></div>

<div class="card">
<h2>Send Message</h2>

<form id="messageForm">
<div class="grid">

<div>
<label for="receiver">Recipient</label>
<select id="receiver" required>
<option value="">Loading staff...</option>
</select>
</div>

<div>
<label for="subject">Subject</label>
<input id="subject" maxlength="200" placeholder="Message subject">
</div>

<div class="full">
<label for="body">Message</label>
<textarea id="body" required placeholder="Write your message..."></textarea>
</div>

<div class="full">
<button type="submit" class="primary">Send Message</button>
</div>

</div>
</form>
</div>

<div class="card">
<h2>My Messages</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>From</th>
<th>To</th>
<th>Subject</th>
<th>Status</th>
<th>Date</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="messageTable">
<tr>
<td colspan="6" class="muted">Loading messages...</td>
</tr>
</tbody>
</table>
</div>
</div>

<div class="card" id="viewBox">
<h2>Message</h2>
<div id="messageMeta" class="meta"></div>
<div id="messageBody" class="message-body"></div>
<div style="margin-top:15px">
<button class="secondary" onclick="closeMessage()">Close</button>
</div>
</div>

</main>

<script>
const API_BASE="https://kenbridge-christian-school.onrender.com/api";
let messages=[];

function token(){
return localStorage.getItem("token")||
localStorage.getItem("access_token")||
localStorage.getItem("supabaseToken")||"";
}

function headers(){
const h={"Content-Type":"application/json"};
const t=token();
if(t)h.Authorization="Bearer "+t;
return h;
}

function currentUserId(){
return localStorage.getItem("user_id")||
localStorage.getItem("userId")||"";
}

function escapeHtml(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function showMessage(text,type="success"){
const box=document.getElementById("message");
box.textContent=text;
box.className="notice "+type;
box.style.display="block";
setTimeout(()=>box.style.display="none",4000);
}

function formatDate(v){
return v?new Date(v).toLocaleString():"—";
}

async function loadStaff(){
const select=document.getElementById("receiver");

try{
const res=await fetch(API_BASE+"/messages/staff",{headers:headers()});
const data=await res.json();

if(!res.ok)throw new Error(data.error||"Failed to load staff");

const staff=data.staff||[];

if(!staff.length){
select.innerHTML='<option value="">No staff members found</option>';
return;
}

select.innerHTML='<option value="">Select recipient</option>'+
staff.map(u=>`
<option value="${escapeHtml(u.id)}">
${escapeHtml(u.full_name||u.username||u.email||"Staff member")}
</option>`).join("");

}catch(err){
select.innerHTML=
`<option value="">${escapeHtml(err.message)}</option>`;
showMessage(err.message,"error");
}
}

async function loadMessages(){
try{
const res=await fetch(API_BASE+"/messages",{headers:headers()});
const data=await res.json();

if(!res.ok)throw new Error(data.error||"Failed to load messages");

messages=data.messages||[];
renderMessages();

}catch(err){
document.getElementById("messageTable").innerHTML=
`<tr><td colspan="6" class="muted">${escapeHtml(err.message)}</td></tr>`;
}
}

function renderMessages(){
const table=document.getElementById("messageTable");

if(!messages.length){
table.innerHTML=
'<tr><td colspan="6" class="muted">No messages found.</td></tr>';
return;
}

table.innerHTML=messages.map(m=>{
const unread=!m.is_read;

return `
<tr class="${unread?"unread":""}">
<td>${escapeHtml(m.sender_name||m.sender_username||"Unknown")}</td>
<td>${escapeHtml(m.receiver_name||m.receiver_username||"Unknown")}</td>
<td>${escapeHtml(m.subject||"(No subject)")}</td>
<td>
<span class="badge ${unread?"unread-badge":"read"}">
${unread?"Unread":"Read"}
</span>
</td>
<td>${escapeHtml(formatDate(m.created_at))}</td>
<td>
<div class="actions">
<button class="secondary" onclick="viewMessage('${m.id}')">View</button>
${unread&&m.receiver_id===currentUserId()?
`<button class="primary" onclick="markRead('${m.id}')">Mark Read</button>`:""}
<button class="danger" onclick="deleteMessage('${m.id}')">Delete</button>
</div>
</td>
</tr>`;
}).join("");
}

function viewMessage(id){
const m=messages.find(x=>x.id===id);
if(!m)return;

document.getElementById("messageMeta").innerHTML=
`<strong>From:</strong> ${escapeHtml(m.sender_name||m.sender_username||"Unknown")}
<br><strong>To:</strong> ${escapeHtml(m.receiver_name||m.receiver_username||"Unknown")}
<br><strong>Subject:</strong> ${escapeHtml(m.subject||"(No subject)")}
<br><strong>Date:</strong> ${escapeHtml(formatDate(m.created_at))}`;

document.getElementById("messageBody").textContent=m.body||"";
document.getElementById("viewBox").style.display="block";

if(!m.is_read&&m.receiver_id===currentUserId())
markRead(id);
}

function closeMessage(){
document.getElementById("viewBox").style.display="none";
}

async function markRead(id){
try{
const res=await fetch(API_BASE+"/messages/"+id+"/read",{
method:"PATCH",
headers:headers()
});

const data=await res.json();

if(!res.ok)throw new Error(data.error||"Failed to mark message as read");

await loadMessages();

}catch(err){
showMessage(err.message,"error");
}
}

async function deleteMessage(id){
if(!confirm("Delete this message?"))return;

try{
const res=await fetch(API_BASE+"/messages/"+id,{
method:"DELETE",
headers:headers()
});

const data=await res.json();

if(!res.ok)throw new Error(data.error||"Failed to delete message");

showMessage("Message deleted successfully.");
await loadMessages();

}catch(err){
showMessage(err.message,"error");
}
}

document.getElementById("messageForm").addEventListener("submit",async e=>{
e.preventDefault();

const receiver=document.getElementById("receiver").value;
const body=document.getElementById("body").value.trim();

if(!receiver){
showMessage("Please select a recipient.","error");
return;
}

if(!body){
showMessage("Please enter a message.","error");
return;
}

try{
const res=await fetch(API_BASE+"/messages",{
method:"POST",
headers:headers(),
body:JSON.stringify({
receiver_id:receiver,
subject:document.getElementById("subject").value.trim(),
body:body
})
});

const data=await res.json();

if(!res.ok)throw new Error(data.error||"Failed to send message");

showMessage("Message sent successfully.");
document.getElementById("messageForm").reset();
await loadMessages();

}catch(err){
showMessage(err.message,"error");
}
});

loadStaff();
loadMessages();
</script>

</body>
  </html>
