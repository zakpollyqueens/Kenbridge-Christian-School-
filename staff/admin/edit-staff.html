document.addEventListener("DOMContentLoaded",()=>{


const API_BASE="https://kenbridge-christian-school.onrender.com";


const staffId=
new URLSearchParams(
window.location.search
).get("id");


const pageLoading=
document.getElementById("pageLoading");


const staffCard=
document.getElementById("staffCard");


const form=
document.getElementById("staffForm");


const message=
document.getElementById("formMessage");


const button=
document.getElementById("submitButton");


const name=
document.getElementById("staffName");


const username=
document.getElementById("staffUsername");


const position=
document.getElementById("staffRole");


const department=
document.getElementById("staffDepartment");


const email=
document.getElementById("staffEmail");


const phone=
document.getElementById("staffPhone");


const status=
document.getElementById("staffStatus");


const notes=
document.getElementById("staffNotes");


function getAccessToken(){

const keys=[
"access_token",
"kenbridge_access_token",
"kenbridgeAccessToken",
"token"
];


for(const key of keys){

const token=

localStorage.getItem(key)
||

sessionStorage.getItem(key);


if(token){

return token;

}

}


return null;

}


function show(text,type){

message.textContent=text;

message.className=
"form-message "+type;

}


async function loadStaff(){


if(!staffId){

pageLoading.textContent=
"No staff account was selected.";

return;

}


const token=
getAccessToken();


if(!token){

pageLoading.textContent=
"Your administrator session was not found. Please log in again.";

return;

}


try{


const response=

await fetch(

API_BASE+
"/api/auth/staff/"+
encodeURIComponent(staffId),

{

headers:{

Authorization:
"Bearer "+token

}

}

);


const result=
await response.json();


if(
!response.ok
||
!result.success
){

throw new Error(

result.message
||
"Unable to load staff account."

);

}


const staff=
result.staff;


name.value=
staff.full_name
||
"";


username.value=
staff.username
||
"";


position.value=
staff.position
||
"";


department.value=
staff.department
||
"";


email.value=
staff.email
||
"";


phone.value=
staff.phone
||
"";


status.value=

staff.is_active!==false

?

"Active"

:

"Disabled";


notes.value=
staff.notes
||
"";


pageLoading.style.display=
"none";


staffCard.style.display=
"block";


}

catch(error){


console.error(
"LOAD STAFF ERROR:",
error
);


pageLoading.textContent=

error.message
||
"Unable to load the staff account.";


}

}


form.addEventListener(

"submit",

async e=>{


e.preventDefault();


const token=
getAccessToken();


if(!token){

show(

"Your administrator session was not found. Please log in again.",

"error"

);

return;

}


if(
!name.value.trim()
||
!username.value.trim()
||
!position.value
||
!department.value
||
!email.value.trim()
){

show(

"Please complete all required fields.",

"error"

);

return;

}


button.disabled=true;

button.textContent=
"Saving Changes...";


try{


const response=

await fetch(

API_BASE+
"/api/auth/staff/"+
encodeURIComponent(staffId),

{

method:"PUT",

headers:{

"Content-Type":
"application/json",

Authorization:
"Bearer "+token

},

body:

JSON.stringify({

full_name:
name.value.trim(),

username:
username.value.trim(),

position:
position.value,

department:
department.value,

email:
email.value
.trim()
.toLowerCase(),

phone:
phone.value.trim(),

notes:
notes.value.trim(),

is_active:
status.value==="Active"

})

}

);


const result=
await response.json();


if(
!response.ok
||
!result.success
){

throw new Error(

result.message
||
"Staff account could not be updated."

);

}


show(

result.message
||
"Staff account updated successfully.",

"success"

);


setTimeout(

()=>{

window.location.href=
"staff-accounts.html";

},

1200

);


}

catch(error){


console.error(
"UPDATE STAFF ERROR:",
error
);


show(

error.message
||
"Unable to update staff account.",

"error"

);


}

finally{


button.disabled=false;


button.textContent=
"Save Changes";


}

}

);


const logoutButton=
document.getElementById("logoutButton");


if(logoutButton){


logoutButton.addEventListener(

"click",

e=>{


e.preventDefault();


[

"access_token",
"refresh_token",
"kenbridge_access_token",
"kenbridgeAccessToken",
"token",
"user",
"kenbridge_user",
"kenbridgeAdminLoggedIn",
"kenbridgeStaffLoggedIn"

]

.forEach(key=>{


localStorage.removeItem(key);


sessionStorage.removeItem(key);


});


window.location.href=
"../login.html";


}

);


}


loadStaff();


});
