<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Staff | Kenbridge Administrator</title><meta name="description" content="Edit a staff account for Kenbridge Christian School."><meta name="theme-color" content="#08783f"><link rel="stylesheet" href="../../css/style.css"><style>.admin-page{min-height:100vh;background:#f5f7f6}.admin-header{background:#08783f;color:#fff;padding:18px 0}.admin-header-inner,.admin-container{width:min(900px,92%);margin:auto}.admin-header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.admin-brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}.admin-brand-text strong,.admin-brand-text span{display:block}.admin-brand-text strong{font-size:18px}.admin-brand-text span{margin-top:3px;font-size:12px;opacity:.85}.admin-logout,.submit-button,.cancel-button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700}.admin-logout{padding:10px 16px;border:1px solid #ffffff80;border-radius:8px;color:#fff;font-size:14px}.admin-logout:hover{background:#ffffff1f}.admin-container{padding:40px 0 60px}.admin-heading{margin-bottom:28px}.admin-heading small{display:block;margin-bottom:8px;color:#08783f;font-size:12px;font-weight:800;letter-spacing:1.5px}.admin-heading h1{margin:0 0 8px;color:#16352a;font-size:clamp(28px,4vw,40px)}.admin-heading p{margin:0;color:#64736c;line-height:1.7}.staff-form-card{padding:28px;border:1px solid #e1e8e4;border-radius:12px;background:#fff;box-shadow:0 8px 25px #0000000d}.staff-form{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-group{display:flex;flex-direction:column}.form-group.full,.form-actions,.form-message{grid-column:1/-1}.form-group label{margin-bottom:7px;color:#29463a;font-size:13px;font-weight:700}.form-group input,.form-group select,.form-group textarea{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d8e0dc;border-radius:8px;background:#fff;color:#243b31;font:inherit}.form-group textarea{min-height:110px;resize:vertical}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#08783f;box-shadow:0 0 0 3px #08783f1a}.class-help{margin:0 0 10px;color:#718079;font-size:12px;line-height:1.5}.classes-box{border:1px solid #d8e0dc;border-radius:8px;padding:14px;background:#fbfdfc;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.class-option{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e1e8e4;border-radius:7px;background:#fff;font-size:13px;cursor:pointer}.class-option:hover{border-color:#08783f}.class-option input{width:auto;margin:0}.classes-disabled{opacity:.55;pointer-events:none}.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px}.submit-button,.cancel-button{padding:13px 20px;border-radius:8px;font-size:14px;cursor:pointer}.submit-button{border:0;background:#08783f;color:#fff}.submit-button:hover{opacity:.92}.submit-button:disabled{opacity:.65;cursor:not-allowed}.cancel-button{border:1px solid #d7e0db;background:#fff;color:#315244}.cancel-button:hover{border-color:#08783f;color:#08783f}.form-message{display:none;padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.5}.form-message.success{display:block;background:#e8f5ed;color:#08783f;border:1px solid #c9e6d3}.form-message.error{display:block;background:#fbeaea;color:#a33a3a;border:1px solid #edcaca}.page-loading{text-align:center;padding:40px;color:#64736c}.required{color:#b62c2c}@media(max-width:700px){.admin-header-inner{align-items:flex-start}.admin-brand img{width:44px;height:44px}.admin-brand-text strong{font-size:15px}.admin-container{padding-top:30px}.staff-form{grid-template-columns:1fr}.form-group.full,.form-actions,.form-message{grid-column:auto}.staff-form-card{padding:20px}.classes-box{grid-template-columns:1fr 1fr}}@media(max-width:420px){.classes-box{grid-template-columns:1fr}}</style><script src="../../js/portal-auth.js"></script></head><body><div class="admin-page"><header class="admin-header"><div class="admin-header-inner"><a href="admin-dashboard.html" class="admin-brand"><img src="../../images/logo.png" alt="Kenbridge Christian School Logo"><div class="admin-brand-text"><strong>Kenbridge Christian School</strong><span>Administrator Portal</span></div></a><a href="../login.html" class="admin-logout" id="logoutButton">Logout</a></div></header><main class="admin-container"><div class="admin-heading"><small>ADMINISTRATOR</small><h1>Edit Staff Account</h1><p>Update the selected staff member's authorised portal account and class permissions.</p></div><div id="pageLoading" class="page-loading">Loading staff account...</div><section class="staff-form-card" id="staffCard" style="display:none"><form class="staff-form" id="staffForm"><div class="form-group"><label for="staffName">Full Name <span class="required">*</span></label><input type="text" id="staffName" required autocomplete="name"></div><div class="form-group"><label for="staffUsername">Username <span class="required">*</span></label><input type="text" id="staffUsername" required autocomplete="username"></div><div class="form-group"><label for="staffRole">Position <span class="required">*</span></label><select id="staffRole" required><option value="">Select position</option><option value="Administrator">Administrator</option><option value="Teacher">Teacher</option><option value="Head Teacher">Head Teacher</option><option value="Deputy Head Teacher">Deputy Head Teacher</option><option value="Bursar">Bursar</option><option value="Secretary">Secretary</option><option value="Staff">Staff</option></select></div><div class="form-group"><label for="staffDepartment">Department <span class="required">*</span></label><select id="staffDepartment" required><option value="">Select department</option><option value="Administration">Administration</option><option value="Academics">Academics</option><option value="Finance">Finance</option><option value="Admissions">Admissions</option><option value="Boarding">Boarding</option><option value="Sports">Sports</option><option value="General Staff">General Staff</option></select></div><div class="form-group"><label for="staffEmail">Email Address <span class="required">*</span></label><input type="email" id="staffEmail" required autocomplete="email"></div><div class="form-group"><label for="staffPhone">Phone Number</label><input type="tel" id="staffPhone" autocomplete="tel"></div><div class="form-group"><label for="staffStatus">Account Status</label><select id="staffStatus"><option value="Active">Active</option><option value="Disabled">Disabled</option></select></div><div class="form-group full" id="classesGroup"><label>Assigned Classes</label><p class="class-help" id="classHelp">Select the classes this staff member is authorised to access.</p><div id="classesBox" class="classes-box"></div></div><div class="form-group full"><label for="staffNotes">Additional Notes</label><textarea id="staffNotes" placeholder="Optional notes about this staff member"></textarea></div><div class="form-message" id="formMessage" role="alert"></div><div class="form-actions"><button type="submit" class="submit-button" id="submitButton">Save Changes</button><a href="staff-accounts.html" class="cancel-button">Cancel</a></div></form></section></main></div><script>
document.addEventListener("DOMContentLoaded",()=>{
const API_BASE="https://kenbridge-christian-school.onrender.com",staffId=new URLSearchParams(location.search).get("id"),pageLoading=document.getElementById("pageLoading"),staffCard=document.getElementById("staffCard"),form=document.getElementById("staffForm"),message=document.getElementById("formMessage"),button=document.getElementById("submitButton"),nameInput=document.getElementById("staffName"),usernameInput=document.getElementById("staffUsername"),positionInput=document.getElementById("staffRole"),departmentInput=document.getElementById("staffDepartment"),emailInput=document.getElementById("staffEmail"),phoneInput=document.getElementById("staffPhone"),statusInput=document.getElementById("staffStatus"),notesInput=document.getElementById("staffNotes"),classesBox=document.getElementById("classesBox"),classesGroup=document.getElementById("classesGroup"),classHelp=document.getElementById("classHelp");

const CLASSES=["Baby Class","Middle Class","Top Class","P1","P2","P3","P4","P5","P6","P7"];

function getAccessToken(){for(const key of["access_token","kenbridge_access_token","kenbridgeAccessToken","token"]){const token=localStorage.getItem(key)||sessionStorage.getItem(key);if(token)return token}return null}
function showMessage(text,type){message.textContent=text;message.className="form-message "+type}
function clearMessage(){message.textContent="";message.className="form-message"}

function renderClasses(selected=[]){
const chosen=new Set((Array.isArray(selected)?selected:[]).map(value=>String(value).trim().toUpperCase()));
classesBox.innerHTML=CLASSES.map(className=>`<label class="class-option"><input type="checkbox" name="assigned_classes" value="${className}" ${chosen.has(className.toUpperCase())?"checked":""}><span>${className}</span></label>`).join("");
updateClassAccess();
}

function selectedClasses(){
return [...document.querySelectorAll('input[name="assigned_classes"]:checked')].map(input=>input.value);
}

function isAdministrator(){
return positionInput.value.trim().toLowerCase()==="administrator";
}

function updateClassAccess(){
const admin=isAdministrator();
classesBox.classList.toggle("classes-disabled",admin);
classesBox.querySelectorAll('input[name="assigned_classes"]').forEach(input=>{
input.disabled=admin;
if(admin)input.checked=false;
});
classHelp.textContent=admin?"Administrators have unrestricted portal access and do not require class permissions.":"Select the classes this staff member is authorised to access.";
}

positionInput.addEventListener("change",updateClassAccess);

async function loadStaff(){
if(!staffId){pageLoading.textContent="No staff account was selected.";return}
const token=getAccessToken();
if(!token){pageLoading.textContent="Your administrator session was not found. Please log in again.";return}
try{
const response=await fetch(API_BASE+"/api/auth/staff/"+encodeURIComponent(staffId),{headers:{Authorization:"Bearer "+token}});
let result;try{result=await response.json()}catch{result={}}
if(!response.ok||!result.success||!result.staff)throw new Error(result.message||"Unable to load staff account.");
const staff=result.staff;
nameInput.value=staff.full_name||"";
usernameInput.value=staff.username||"";
positionInput.value=staff.position||staff.role||"";
departmentInput.value=staff.department||"";
emailInput.value=staff.email||"";
phoneInput.value=staff.phone||"";
statusInput.value=staff.is_active!==false?"Active":"Disabled";
notesInput.value=staff.notes||"";
renderClasses(staff.classes||[]);
pageLoading.style.display="none";
staffCard.style.display="block";
}catch(error){
console.error("LOAD STAFF ERROR:",error);
pageLoading.textContent=error.message||"Unable to load the staff account.";
}
}

form.addEventListener("submit",async event=>{
event.preventDefault();
clearMessage();
if(!staffId)return showMessage("No staff account was selected.","error");
const token=getAccessToken();
if(!token)return showMessage("Your administrator session was not found. Please log in again.","error");

const fullName=nameInput.value.trim(),username=usernameInput.value.trim(),position=positionInput.value,department=departmentInput.value,email=emailInput.value.trim().toLowerCase(),phone=phoneInput.value.trim(),notes=notesInput.value.trim(),isActive=statusInput.value==="Active",classes=isAdministrator()?[]:selectedClasses();

if(!fullName||!username||!position||!department||!email)return showMessage("Please complete all required fields.","error");

button.disabled=true;
button.textContent="Saving Changes...";

try{
const response=await fetch(API_BASE+"/api/auth/staff/"+encodeURIComponent(staffId),{
method:"PUT",
headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
body:JSON.stringify({full_name:fullName,username,position,department,email,phone,notes,is_active:isActive,classes})
});

let result;try{result=await response.json()}catch{result={}}

if(!response.ok||!result.success)throw new Error(result.message||"Staff account could not be updated.");

showMessage(result.message||"Staff account and class permissions updated successfully.","success");

setTimeout(()=>location.href="staff-accounts.html",1200);

}catch(error){
console.error("UPDATE STAFF ERROR:",error);
showMessage(error.message||"Unable to update staff account.","error");
}finally{
button.disabled=false;
button.textContent="Save Changes";
}
});

document.getElementById("logoutButton").addEventListener("click",event=>{
event.preventDefault();
["access_token","refresh_token","kenbridge_access_token","kenbridgeAccessToken","kenbridgeRefreshToken","kenbridgeUser","token","user","kenbridge_user","kenbridgeAdminLoggedIn","kenbridgeStaffLoggedIn","kenbridgeUserRole"].forEach(key=>{
localStorage.removeItem(key);
sessionStorage.removeItem(key);
});
location.href="../login.html";
});

renderClasses();
loadStaff();
});
</script></body></html>
