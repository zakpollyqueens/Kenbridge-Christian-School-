<!DOCTYPE html>

<html lang="en">
<head>

<meta name="description" content="Kenbridge Christian School administrator notifications.">
<meta name="theme-color" content="#08783f">
<link rel="stylesheet" href="../../css/style.css">
<style>
.admin-page{min-height:100vh;background:#f5f7f6}.admin-header{background:#08783f;color:#fff;padding:18px 0}.admin-header-inner{width:min(1200px,92%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.admin-brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}.admin-brand strong{display:block;font-size:18px}.admin-brand span{display:block;font-size:12px;margin-top:3px;opacity:.85}.admin-logout{padding:10px 16px;border:2px solid #f28c28;border-radius:8px;background:#f28c28;color:#fff;text-decoration:none;font-size:14px;font-weight:700}.admin-logout:hover{background:#fff;color:#08783f}.admin-container{width:min(1200px,92%);margin:auto;padding:40px 0 60px}.admin-heading{margin-bottom:25px}.admin-heading small{display:block;color:#08783f;font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px}.admin-heading h1{margin:0 0 8px;color:#16352a;font-size:clamp(28px,4vw,40px)}.admin-heading p{margin:0;color:#64736c;line-height:1.7}.admin-nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}.admin-nav a{padding:10px 14px;border:1px solid #dce5e0;border-radius:8px;background:#fff;color:#315244;text-decoration:none;font-size:13px;font-weight:600}.admin-nav a:hover,.admin-nav a.active{background:#08783f;border-color:#08783f;color:#fff}.notification-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.notification-actions{display:flex;gap:10px;flex-wrap:wrap}.notification-tools button{padding:11px 15px;border:1px solid #d7e0db;border-radius:8px;background:#fff;color:#315244;font-weight:700;cursor:pointer}.notification-tools button:hover{border-color:#08783f;color:#08783f}.notification-count{padding:10px 14px;border-radius:8px;background:#eef6f1;color:#08783f;font-size:13px;font-weight:800}.notification-list{display:grid;gap:12px}.notification{background:#fff;border:1px solid #e1e8e4;border-left:4px solid #08783f;border-radius:10px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.04);cursor:pointer;transition:.2s}.notification:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.07)}.notification.unread{border-left-color:#f28c28;background:#fffaf5}.notification-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.notification h3{margin:0 0 6px;color:#173a2c;font-size:16px}.notification p{margin:0 0 9px;color:#607069;line-height:1.6;font-size:14px}.notification small{color:#87938e}.notification-type{padding:5px 9px;border-radius:20px;background:#eef6f1;color:#08783f;font-size:10px;font-weight:800;white-space:nowrap}.notification-empty,.notification-loading,.notification-error{text-align:center;padding:30px;background:#fff;border:1px solid #e1e8e4;border-radius:10px;color:#718079}.notification-error{color:#a12b2b;background:#fff7f7;border-color:#f0d4d4}.hidden{display:none!important}@media(max-width:650px){.admin-header-inner{align-items:flex-start}.admin-brand img{width:44px;height:44px}.admin-brand strong{font-size:15px}.admin-brand span{font-size:11px}.admin-logout{padding:8px 11px;font-size:12px}.admin-container{padding-top:30px}.notification-tools{align-items:stretch}.notification-actions{display:grid;grid-template-columns:1fr}.notification-tools button{width:100%}.notification-top{flex-direction:column;gap:7px}}
</style>
<script src="../../js/portal-auth.js"></script>
</head>
<body>
<div class="admin-page">
<header class="admin-header">
<div class="admin-header-inner">
<a href="admin-dashboard.html" class="admin-brand">
<img src="../../images/logo.png" alt="Kenbridge Christian School Logo">
<div><strong>Kenbridge Christian School</strong><span>Administrator Portal</span></div>
</a>
<a href="../login.html" class="admin-logout" id="logoutButton">Logout</a>
</div>
</header>

<main class="admin-container">
<div class="admin-heading">
<small>ADMINISTRATOR</small>
<h1>Notifications</h1>
<p>View important portal updates.</p>
</div>

<nav class="admin-nav">
<a href="admin-dashboard.html">Dashboard</a>
<a href="staff-accounts.html">Staff Accounts</a>
<a href="add-staff.html">Add Staff</a>
<a href="pending-content.html">Pending Content</a>
<a href="admin-profile.html">My Profile</a>
<a href="notifications.html" class="active">Notifications</a>
<a href="activity-log.html">Activity Log</a>
<a href="reports.html">Reports</a>
<a href="files.html">Files</a>
<a href="security.html">Security</a>
<a href="settings.html">Settings</a>
</nav>

<div class="notification-tools">
<div class="notification-count" id="notificationCount">Loading...</div>
<div class="notification-actions">
<button type="button" id="markRead">Mark All as Read</button>
<button type="button" id="clearNotifications">Clear Notifications</button>
</div>
</div>

<section class="notification-list" id="notificationList">
<div class="notification-loading">Loading...</div>
</section>

<div class="notification-empty hidden" id="notificationEmpty">
No notifications available.
</div>
</main>
</div>

<script>
const API_BASE=""https://kenbridge-christian-school.onrender.com" (https://kenbridge-christian-school.onrender.com)";

document.addEventListener("DOMContentLoaded",function(){
const list=document.getElementById("notificationList");
const empty=document.getElementById("notificationEmpty");
const count=document.getElementById("notificationCount");
const markRead=document.getElementById("markRead");
const clearNotifications=document.getElementById("clearNotifications");
const logoutButton=document.getElementById("logoutButton");

function getAccessToken(){
return ["kenbridgeAccessToken","access_token","kenbridge_access_token","token"]
.map(k=>localStorage.getItem(k)||sessionStorage.getItem(k)).find(Boolean)||null;
}

function clearSession(){
["kenbridgeAccessToken","kenbridgeRefreshToken","kenbridgeUser","access_token","refresh_token","kenbridge_access_token","token","user","kenbridge_user"].forEach(k=>localStorage.removeItem(k));
["kenbridgeStaffLoggedIn","kenbridgeUserRole","kenbridgeAdminLoggedIn"].forEach(k=>sessionStorage.removeItem(k));
}

function escapeHTML(value){
const div=document.createElement("div");
div.textContent=value??"";
return div.innerHTML;
}

function formatDate(value){
const date=new Date(value);
return value&&!isNaN(date) ? date.toLocaleString("en-UG",{dateStyle:"medium",timeStyle:"short"}) : "Recently";
}

function getIcon(type){
return {TASK:"📋",MESSAGE:"💬",TRAINING:"🎓",RESOURCE:"📚",SECURITY:"🔐",ANNOUNCEMENT:"📢"}[String(type||"").toUpperCase()]||"🔔";
}

async function apiRequest(path,options={}){
const token=getAccessToken();
if(!token)throw Error("Please log in again.");
const response=await fetch(API_BASE+path,{...options,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",...(options.headers||{})}});
const data=await response.json().catch(()=>{throw Error("Invalid server response.")});
if(!response.ok||data.success===false)throw Error(data.message||"Request failed.");
return data;
}

function renderNotifications(notifications){
list.innerHTML="";
empty.classList.toggle("hidden",notifications.length>0);
if(!notifications.length){count.textContent="0 notifications";return;}

const unread=notifications.filter(n=>n.is_read===false||n.is_read===0).length;
count.textContent=`${notifications.length} notification${notifications.length===1?"":"s"} • ${unread} unread`;

notifications.forEach(n=>{
const article=document.createElement("article");
const type=n.notification_type||n.type||"GENERAL";
article.className="notification"+((n.is_read===false||n.is_read===0)?" unread":"");
article.dataset.id=n.id||"";
article.dataset.actionUrl=n.action_url||"";
article.innerHTML=`<div class="notification-top"><div><h3>${getIcon(type)} ${escapeHTML(n.title||"Notification")}</h3><p>${escapeHTML(n.message||n.body||"You have a new notification.")}</p><small>${escapeHTML(formatDate(n.created_at))}</small></div><span class="notification-type">${escapeHTML(type.replace(/_/g," ").toUpperCase())}</span></div>`;

article.onclick=async()=>{
if(article.dataset.id&&article.classList.contains("unread")){
try{await apiRequest(`/api/notifications/${encodeURIComponent(article.dataset.id)}/read`,{method:"PATCH"});loadNotifications()}catch(e){console.error(e)}
}
if(article.dataset.actionUrl)location.href=article.dataset.actionUrl;
};
list.appendChild(article);
});
}

async function loadNotifications(){
list.innerHTML='<div class="notification-loading">Loading...</div>';
try{renderNotifications((await apiRequest("/api/notifications")).notifications||[])}
catch(error){
list.innerHTML=`<div class="notification-error">${escapeHTML(error.message)}</div>`;
count.textContent="Unavailable";
if(/session|token|authorization|expired|invalid/i.test(error.message)){clearSession();setTimeout(()=>location.replace("../login.html"),1500)}
}
}

markRead.onclick=async()=>{
markRead.disabled=true;
try{await apiRequest("/api/notifications/read-all",{method:"PATCH"});loadNotifications()}
catch(e){alert(e.message)}
finally{markRead.disabled=false}
};

clearNotifications.onclick=async()=>{
if(!confirm("Clear all notifications?"))return;
clearNotifications.disabled=true;
try{await apiRequest("/api/notifications",{method:"DELETE"});loadNotifications()}
catch(e){alert(e.message)}
finally{clearNotifications.disabled=false}
};

logoutButton.onclick=e=>{e.preventDefault();clearSession();location.replace("../login.html")};
loadNotifications();
});
</script>

</body>
  </html>
