<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | Kenbridge Christian School</title>

    <meta name="description" content="Kenbridge Christian School staff portal login.">
    <meta name="theme-color" content="#08783f">

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =====================================================
           STAFF LOGIN ANIMATED BACKGROUND
        ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;
            background: #071b12;
            overflow-x: hidden;
        }

        .staff-login-page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(8,120,63,.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(245,140,35,.38),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #071b12,
                    #0b5f35,
                    #10281d
                );
        }

        /* Animated background glow */

        .staff-login-page::before,
        .staff-login-page::after {
            content: "";
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(70px);
            opacity: .55;

            pointer-events: none;
            z-index: 0;
        }

        /* Green animated glow */

        .staff-login-page::before {
            background: #08783f;

            top: -150px;
            left: -120px;

            animation:
                greenGlow 10s ease-in-out infinite alternate;
        }

        /* Orange animated glow */

        .staff-login-page::after {
            background: #f28c28;

            right: -140px;
            bottom: -160px;

            animation:
                orangeGlow 12s ease-in-out infinite alternate;
        }

        @keyframes greenGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(120px, 80px) scale(1.2);
            }

            100% {
                transform: translate(30px, 180px) scale(.9);
            }
        }

        @keyframes orangeGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-120px, -100px) scale(1.25);
            }

            100% {
                transform: translate(-40px, -180px) scale(.9);
            }
        }

        /* Keep login content above animation */

        .staff-login-page > * {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body>

    <!-- =====================================================
         STAFF LOGIN
    ====================================================== -->

    <main class="staff-login-page">

        <section
            class="staff-login-card"
            aria-labelledby="staffLoginTitle"
        >

            <!-- SCHOOL LOGO -->

            <img
                src="../images/logo.png"
                alt="Kenbridge Christian School Logo"
                class="staff-login-logo"
            >

            <!-- TITLE -->

            <h1 id="staffLoginTitle">
                Staff Login
            </h1>

            <p class="staff-login-subtitle">
                Kenbridge Christian School Staff Portal
            </p>

            <!-- LOGIN FORM -->

            <form
                id="staffLoginForm"
                autocomplete="off"
            >

                <!-- USERNAME -->

                <div class="staff-login-field">

                    <label for="staffUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="staffUsername"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- PASSWORD -->

                <div class="staff-login-field">

                    <label for="staffPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffPassword"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- BUTTON -->

                <button
                    type="submit"
                    class="staff-login-button"
                >
                    Sign In
                </button>

                <!-- MESSAGE -->

                <p
                    id="staffLoginMessage"
                    class="staff-login-message"
                    role="alert"
                ></p>

            </form>

            <!-- NOTICE -->

            <div class="staff-login-notice">

                <strong>
                    Staff Portal Notice
                </strong>

                <br>

                This is the initial staff portal prototype.
                Secure server-side authentication and
                database storage will be connected in a
                later stage.

            </div>

            <!-- BACK -->

            <a
                href="../index.html"
                class="staff-login-back"
            >
                ← Back to Kenbridge Website
            </a>

        </section>

    </main>

    <!-- =====================================================
         TEMPORARY LOGIN SCRIPT
    ====================================================== -->

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const form =
                document.getElementById("staffLoginForm");

            const message =
                document.getElementById("staffLoginMessage");

            if (!form || !message) {
                return;
            }

            form.addEventListener("submit", function (event) {

                event.preventDefault();

                const username =
                    document
                        .getElementById("staffUsername")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("staffPassword")
                        .value;

                /*
                 * TEMPORARY DEMO LOGIN
                 *
                 * This will be replaced with proper
                 * secure authentication when the
                 * backend is connected.
                 */

                if (
                    username === "staff" &&
                    password === "kenbridge-demo"
                ) {

                    sessionStorage.setItem(
                        "kenbridgeStaffLoggedIn",
                        "true"
                    );

                    window.location.href =
                        "staff-dashboard.html";

                    return;
                }

                message.textContent =
                    "Incorrect username or password.";

                message.className =
                    "staff-login-message error";
            });
        });
    </script>

</body>
      </html>
